apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
  spec:
    containers:
        - name: backend
          image: store-backend
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: DB_PATH
              value: /app/database.db