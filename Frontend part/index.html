<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s Store Factory</title>
    <link rel="stylesheet" href="navbar.css">
</head>
<body>
    <div class="wrap">
        <div class="login-page">

            <img src="assets/k8-logo.png" alt="K8s Logo" class="logo-img">
            <h1>K8s Store Factory</h1>
            <p>Sign in to manage your stores</p>

            <div class="field">
                <label>Username</label>
                <input type="text" placeholder="admin" id="username">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" placeholder="Enter your password" id="password">
            </div>

            <p class="error-msg" id="error">wrong username</p>

            <button class="btn" onclick="login()">Sign in</button>

        </div>
    </div>

    <script src="navbar.js"></script>
</body>
</html>
