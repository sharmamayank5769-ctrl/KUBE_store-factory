<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch New Store</title>
    <link rel="stylesheet" href="new.css">
</head>
<body>

<div class="overlay">
    <div class="modal">

        <div class="modal-header">
            <h2>Launch New Store</h2>
            <button class="close-btn" id="close-btn">✕</button>
        </div>

        <div class="field">
            <label>Admin Password</label>
            <div class="password-row">
                <input type="text" id="admin-password" value="NwAwoB$5fK#iN@le">
                <button class="icon-btn" id="generate-btn">↻</button>
                <button class="icon-btn" id="copy-btn">⧉</button>
            </div>
            <p class="hint">This will be the password for the 'admin' user.</p>
        </div>

        <div class="field">
            <label>WordPress Storage Size (Gi)</label>
            <input type="number" id="storage-size" value="2" min="1" max="10">
            <p class="hint">Note: MySQL requires additional 1Gi. Total: <span id="total-storage">3</span>Gi</p>
        </div>

        <div class="field">
            <label>Initial Products</label>
            <div id="products-list">

                <div class="product-row">
                    <input type="text" placeholder="Product Name" value="ADD">
                    <input type="number" placeholder="Price" value="00">
                    <input type="text" placeholder="Description" value="ADD">
                    <button class="delete-product">🗑</button>
                </div>

                <div class="product-row">
                    <input type="text" placeholder="Product Name" value="ADD">
                    <input type="number" placeholder="Price" value="00">
                    <input type="text" placeholder="Description" value="ADD">
                    <button class="delete-product">🗑</button>
                </div>

                <div class="product-row">
                    <input type="text" placeholder="Product Name" value="ADD">
                    <input type="number" placeholder="Price" value="00">
                    <input type="text" placeholder="Description" value="ADD">
                    <button class="delete-product">🗑</button>
                </div>

            </div>
            <button class="add-product-btn" id="add-product-btn">+ Add Product</button>
        </div>

        <div class="modal-actions">
            <button class="cancel-btn" id="cancel-btn">Cancel</button>
            <button class="launch-btn" id="launch-btn">Launch Store</button>
        </div>

    </div>
</div>

<script src="new-store.js"></script>
</body>
</html>
