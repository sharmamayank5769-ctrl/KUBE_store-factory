<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - K8s Store Factory</title>
    <link rel="stylesheet" href="navbar.css">
</head>
<body>
    <div class="wrap">
        <div class="login-page">
            <h1>K8s Store Factory</h1>
            <p>Create a new account</p>

            <div class="field">
                <label>Username</label>
                <input type="text" id="username" placeholder="Choose a username">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="password" placeholder="Choose a password">
            </div>

            <p class="error-msg" id="error"></p>

            <button class="btn" id="signup-btn">Sign Up</button>

            <p style="text-align:center; margin-top: 1rem; font-size: 13px;">
                Already have an account? <a href="index.html">Login here</a>
            </p>
        </div>
    </div>

    <script src="signup.js"></script>
</body>
</html>
